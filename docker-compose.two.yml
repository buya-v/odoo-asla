services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - two-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 5s
      timeout: 5s
      retries: 12

  hub:
    image: odoo:18
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8069:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    volumes:
      - ./addons:/mnt/extra-addons
      - two-hub:/var/lib/odoo
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["odoo", "--db-filter=^asla_hub$", "-d", "asla_hub"]

  bot:
    image: odoo:18
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8071:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    volumes:
      - ./addons:/mnt/extra-addons
      - two-bot:/var/lib/odoo
    command: ["odoo", "--db-filter=^asla_bot$", "-d", "asla_bot"]

volumes:
  two-db:
  two-hub:
  two-bot:
